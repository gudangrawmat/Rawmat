    function renderLimit() {
        let list = document.getElementById('listLimit');
        if (!list) return;
        list.innerHTML = '';

        let term = document.getElementById('cariLimit') ? document.getElementById('cariLimit').value.toLowerCase() : "";
        let filterCriticalOnly = document.getElementById('filterCriticalOnly') ? document.getElementById('filterCriticalOnly').checked : false;
        
        let keluarCounts = {};
        riwayatKeluar.forEach(x => {
            let c = (x.code || "").toUpperCase();
            keluarCounts[c] = (keluarCounts[c] || 0) + 1;
        });

        let allCodes = [...new Set([...Object.keys(itemLimits), ...data.map(x => x.code)])];
        allCodes.sort((a, b) => {
            let countA = keluarCounts[a.toUpperCase()] || 0;
            let countB = keluarCounts[b.toUpperCase()] || 0;
            if (countB !== countA) {
                return countB - countA; 
            }
            return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
        });
        
        let filteredCodes = allCodes.filter(code => {
            let currentStockQty = data.filter(x => (x.code || "").toUpperCase() === code).reduce((sum, item) => sum + Number(item.qty || 0), 0);
            let currentCount = data.filter(x => (x.code || "").toUpperCase() === code).length;
            let isCritical = (currentStockQty === 1 || currentCount === 1);

            let matchesTerm = code.toLowerCase().includes(term);
            if (!matchesTerm) return false;

            if (filterCriticalOnly) {
                return isCritical;
            }
            return true;
        });

        if (filteredCodes.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">Tidak ada data limit item yang sesuai filter.</div>';
            return;
        }

        if (pageLimit['MAIN'] === undefined) pageLimit['MAIN'] = 0;
        let totalPages = Math.ceil(filteredCodes.length / itemsPerPage);
        let start = pageLimit['MAIN'] * itemsPerPage;
        let displayCodes = filteredCodes.slice(start, start + itemsPerPage);

        let rowsHTML = displayCodes.map(code => {
            let currentStockQty = data.filter(x => (x.code || "").toUpperCase() === code).reduce((sum, item) => sum + Number(item.qty || 0), 0);
            let currentCount = data.filter(x => (x.code || "").toUpperCase() === code).length;

            let limitData = itemLimits[code] || { min: '-' };
            let min = limitData.min;

            let statusBadge = `<span style="background:#e2e8f0; color:#475569; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold;">⚪ Belum Diset</span>`;
            let rowStyle = "";

            if (currentStockQty === 1 || currentCount === 1) {
                statusBadge = `<span style="background:#fef9c3; color:#854d0e; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold; border:1px solid #fde047;">⚠️ Critical (Sisa 1)</span>`;
                rowStyle = "background: #fefce8;";
            } else if (min !== '-') {
                let minVal = Number(min);
                if (currentStockQty < minVal) {
                    statusBadge = `<span style="background:#fee2e2; color:#b91c1c; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold; border:1px solid #fecaca;">⚠️ Kurang</span>`;
                    rowStyle = "background: #fff5f5;";
                } else {
                    statusBadge = `<span style="background:#dcfce7; color:#166534; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold; border:1px solid #bbf7d0;">✅ Aman</span>`;
                }
            }

            return `<tr style="${rowStyle} border-bottom: 1px solid #f1f5f9;">
                        <td style="padding: 10px; font-weight: bold;">${code}</td>
                        <td style="padding: 10px;">${currentStockQty} Kg (${currentCount} Pcs)</td>
                        <td style="padding: 10px;">${min} Kg</td>
                        <td style="padding: 10px;">${statusBadge}</td>
                        <td style="padding: 10px; text-align: center; white-space: nowrap;">
                            <button class="btn-action" style="font-size:11px; padding: 4px 8px;" onclick="editLimitPrompt('${code}', '${min}')">✏️ Edit</button>
                            <button class="btn-action btn-delete" style="font-size:11px; padding: 4px 8px;" onclick="hapusItemLimit('${code}')">🗑️ Hapus</button>
                        </td>
                    </tr>`;
        }).join('');

        let paginationHTML = '';
        if (totalPages > 1) {
            paginationHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                        <button class="btn-action" onclick="changePageLimit(-1)">Prev</button>
                        <span style="font-size:11px; font-weight:600;">${pageLimit['MAIN']+1}/${totalPages}</span>
                        <button class="btn-action" onclick="changePageLimit(1)">Next</button>
                    </div>`;
        }

        list.innerHTML = `
            <div style="overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: var(--shadow); padding: 5px;">
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr style="background: #2563eb; color: white; text-align: left;">
                            <th style="padding: 10px;">Kode Item</th>
                            <th style="padding: 10px;">Stok Saat Ini</th>
                            <th style="padding: 10px;">Min Limit</th>
                            <th style="padding: 10px;">Status</th>
                            <th style="padding: 10px; text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHTML}
                    </tbody>
                </table>
            </div>
            ${paginationHTML}
        `;
    }

    function changePageLimit(dir) {
        let term = document.getElementById('cariLimit') ? document.getElementById('cariLimit').value.toLowerCase() : "";
        let filterCriticalOnly = document.getElementById('filterCriticalOnly') ? document.getElementById('filterCriticalOnly').checked : false;
        
        let keluarCounts = {};
        riwayatKeluar.forEach(x => {
            let c = (x.code || "").toUpperCase();
            keluarCounts[c] = (keluarCounts[c] || 0) + 1;
        });

        let allCodes = [...new Set([...Object.keys(itemLimits), ...data.map(x => x.code)])];
        allCodes.sort((a, b) => {
            let countA = keluarCounts[a.toUpperCase()] || 0;
            let countB = keluarCounts[b.toUpperCase()] || 0;
            if (countB !== countA) return countB - countA;
            return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
        });

        let filteredCodes = allCodes.filter(code => {
            let currentStockQty = data.filter(x => (x.code || "").toUpperCase() === code).reduce((sum, item) => sum + Number(item.qty || 0), 0);
            let currentCount = data.filter(x => (x.code || "").toUpperCase() === code).length;
            let isCritical = (currentStockQty === 1 || currentCount === 1);
            let matchesTerm = code.toLowerCase().includes(term);
            if (!matchesTerm) return false;
            if (filterCriticalOnly) return isCritical;
            return true;
        });

        let totalPages = Math.ceil(filteredCodes.length / itemsPerPage);
        pageLimit['MAIN'] = Math.max(0, Math.min((pageLimit['MAIN'] || 0) + dir, totalPages - 1));
        renderLimit();
    }

    function saveItemLimit() {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        let code = document.getElementById('limitCode').value.trim().toUpperCase();
        let min = document.getElementById('limitMin').value !== '' ? parseInt(document.getElementById('limitMin').value) : '-';

        if (!code) {
            alert("⚠️ Harap masukkan Kode Item terlebih dahulu!");
            return;
        }

        itemLimits[code] = { 
            min: min, 
            updatedBy: opName, 
            updatedAt: new Date().toLocaleDateString('id-ID') 
        };

        db.ref('item_limits').set(itemLimits).then(() => {
            showToast("✅ Limit item berhasil disimpan!");
            document.getElementById('limitCode').value = '';
            document.getElementById('limitMin').value = '';
            renderLimit();
        });
    }

    function autoSetLimitDariQtyTerkecil() {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        if (!confirm("⚡ Apakah Anda ingin mengisi otomatis limit minimum semua item berdasarkan Qty terkecil dari setiap item di stok saat ini?")) return;

        let uniqueCodes = [...new Set(data.map(x => (x.code || "").toUpperCase()))].filter(Boolean);
        if (uniqueCodes.length === 0) {
            alert("⚠️ Tidak ada data stok di gudang saat ini!");
            return;
        }

        uniqueCodes.forEach(code => {
            let itemEntries = data.filter(x => (x.code || "").toUpperCase() === code);
            let qtys = itemEntries.map(x => Number(x.qty || 0)).filter(q => q > 0);
            if (qtys.length > 0) {
                let minQty = Math.min(...qtys);
                itemLimits[code] = {
                    min: minQty,
                    updatedBy: opName,
                    updatedAt: new Date().toLocaleDateString('id-ID')
                };
            }
        });

        db.ref('item_limits').set(itemLimits).then(() => {
            showToast("✅ Berhasil mengisi otomatis min limit berdasarkan Qty terkecil!");
            renderLimit();
        });
    }

    function hapusItemLimit(code) {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        if (!confirm(`Yakin ingin menghapus pengaturan limit untuk item ${code}?`)) return;
        delete itemLimits[code];
        db.ref('item_limits').set(itemLimits).then(() => {
            showToast("🗑️ Limit item dihapus.");
            renderLimit();
        });
    }

        let opName = localStorage.getItem('opName') || '';

    function tambahKurangLebih() {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        let code = document.getElementById('klCode').value.trim().toUpperCase();
        let qty = document.getElementById('klQty').value;
        let status = document.getElementById('klStatus').value;
        let tgl = document.getElementById('klTgl').value;

        if (!code || !qty || !tgl) {
            alert("⚠️ Harap lengkapi Kode Item, Qty (Kg), dan Tanggal!");
            return;
        }

        let uniqueId = 'kl_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            id: uniqueId,
            code: code,
            qty: qty,
            status: status,
            tgl: tgl,
            operator: opName
        });

            showToast("✅ Berhasil menambahkan item kurang/lebih!");

            document.getElementById('klQty').value = '';
            document.getElementById('klCode').focus();
            renderKurangLebih();
        });

    function hapusKurangLebih(id) {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        if (!confirm("Yakin ingin menghapus item ini dari daftar?")) return;
        dataKurangLebih = dataKurangLebih.filter(x => x.id !== id);
        db.ref('stok_kurang_lebih').set(dataKurangLebih).then(() => {
            showToast("🗑️ Item berhasil dihapus.");
            renderKurangLebih();
        });
    }

    function editKurangLebih(id) {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        let item = dataKurangLebih.find(x => x.id === id);
        if (!item) return;

        let newCode = prompt("Edit Kode Item:", item.code);
        if (newCode === null) return;
        let newQty = prompt("Edit Qty (Kg):", item.qty);
        if (newQty === null) return;
        let newStatus = prompt("Edit Status (Ketik 'Kurang' atau 'Lebih'):", item.status);
        if (newStatus === null) return;

        item.code = newCode.trim().toUpperCase();
        item.qty = newQty.trim();
        item.status = newStatus.trim();
        item.operator = opName;

        db.ref('stok_kurang_lebih').set(dataKurangLebih).then(() => {
            showToast("✅ Data berhasil diperbarui!");
            renderKurangLebih();
        });

        list.style.gridTemplateColumns = "repeat(auto-fit, minmax(280px, 1fr))";
        list.style.gap = "15px";

        let currentOp = localStorage.getItem('opName') || '';
        let knownOps = Object.keys(operatorPasswords);
        let activeOps = [...new Set([...knownOps, ...filtered.map(x => x.operator || 'Tanpa Operator')])];

        activeOps.forEach(opName => {
            let opNameUpper = opName.toUpperCase();
            let opItems = filtered.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opNameUpper);
            
            if (pageCari[opNameUpper] === undefined) pageCari[opNameUpper] = 0;
            let totalPages = Math.ceil(opItems.length / itemsPerPage) || 1;
            let start = pageCari[opNameUpper] * itemsPerPage;
            let displayItems = opItems.slice(start, start + itemsPerPage);

            let colDiv = document.createElement('div');
            colDiv.style.background = "rgba(255, 255, 255, 0.7)";
            colDiv.style.border = "1px solid #cbd5e1";
            colDiv.style.borderRadius = "12px";
            colDiv.style.padding = "15px";
            colDiv.style.boxShadow = "var(--shadow)";
            colDiv.style.display = "flex";
            colDiv.style.flexDirection = "column";

            let html = `<div style="background:#f3e8ff; padding:10px; border-radius:8px; margin-bottom:12px; font-weight:bold; color:#6b21a8; text-align:center;">👤 ${opNameUpper}</div>`;
            
            if (opItems.length === 0) {
                html += `<div style="text-align:center; color:#94a3b8; font-size:12px; padding:20px 0; font-style:italic;">Belum ada riwayat pencarian</div>`;
            } else {
                html += displayItems.map(x => {
                    let actualIndex = riwayatPencarian.indexOf(x);
                    
                    let konfirmasiBadge = x.konfirmasi === "Ya" 
                        ? `<span style="background:#dcfce7; color:#166534; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">Konfirmasi: Ya</span>` 
                        : (x.konfirmasi === "Tidak" 
                            ? `<span style="background:#fee2e2; color:#b91c1c; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">Konfirmasi: Tidak</span>`
                            : `<span style="background:#e2e8f0; color:#475569; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">-</span>`);
                    
                    let tglHapusInfo = (x.konfirmasi === "Ya" && x.tglHapus) 
                        ? `<br><small style="color:#166534;">📅 Tgl Dihapus: <b>${x.tglHapus}</b></small>` 
                        : ""; 

                    let deleteBtnHTML = (currentOp === 'Tri') ? `<button class="btn-action btn-delete" style="margin-top:6px; width:100%;" onclick="hapusRiwayatPencarian(${actualIndex})">🗑️ Hapus Catatan</button>` : '';
                    
                    return `<div class="item-card" style="margin-bottom:8px;">
                                Item: <b>${x.kataKunci}</b><br>
                                ${konfirmasiBadge}
                                ${tglHapusInfo}
                                <small style="display:block; margin-top:4px; color:#94a3b8;">🕒 Terakhir Cari: ${x.tgl} | ${x.jam}</small>
                                ${deleteBtnHTML}
                            </div>`;
                }).join('');
            }

            if (totalPages > 1) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:10px;">
                            <button class="btn-action" style="width:auto" onclick="changePageCari('${opNameUpper}', -1)">Prev</button>
                            <span style="font-size:11px; font-weight:600;">${pageCari[opNameUpper]+1}/${totalPages}</span>
                            <button class="btn-action" style="width:auto" onclick="changePageCari('${opNameUpper}', 1)">Next</button>
                        </div>`;
            }

            colDiv.innerHTML = html;
            list.appendChild(colDiv);
        });
    }
    
    function changePageKeluar(opName, dir) {
        let totalPages = Math.ceil(riwayatKeluar.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageKeluar[opName] = Math.max(0, Math.min((pageKeluar[opName] || 0) + dir, totalPages - 1));
        renderKeluar();
    }

    function changePageMasuk(opName, dir) {
        let totalPages = Math.ceil(riwayatMasuk.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageMasuk[opName] = Math.max(0, Math.min((pageMasuk[opName] || 0) + dir, totalPages - 1));
        renderMasuk();
    }

    function changePageGagal(opName, dir) {
        let totalPages = Math.ceil(riwayatGagalHapus.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageGagal[opName] = Math.max(0, Math.min((pageGagal[opName] || 0) + dir, totalPages - 1));
        renderGagal();
    }

    function changePageCari(opName, dir) {
        let totalPages = Math.ceil(riwayatPencarian.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageCari[opName] = Math.max(0, Math.min((pageCari[opName] || 0) + dir, totalPages - 1));
        renderPencarian();
    }
</script>
</body>
</html>
