<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDANG RAW MATERIAL</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063198.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-light: #dbeafe;
            --bg-start: #e2e8f0;
            --bg-mid: #cbd5e1;
            --bg-end: #f1f5f9;
            --text: #0f172a;
            --text-muted: #64748b;
            --card-glass: rgba(255, 255, 255, 0.5); 
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px #fcd34d; }
            50% { box-shadow: 0 0 15px #fcd34d, 0 0 20px #fbbf24; }
            100% { box-shadow: 0 0 5px #fcd34d; }
        }
        @keyframes warningPulse {
            0% { background-color: #fef2f2; border-color: #fecaca; }
            50% { background-color: #fee2e2; border-color: #ef4444; }
            100% { background-color: #fef2f2; border-color: #fecaca; }
        }
        @keyframes flameShake {
            0% { transform: translateY(0); }
            25% { transform: translateY(-3px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(-2px); }
            100% { transform: translateY(0); }
        }
        .animate-flame { display: inline-block; animation: flameShake 0.6s infinite; }

        body { font-family: 'Inter', sans-serif; background: linear-gradient(-45deg, var(--bg-start), var(--bg-mid), var(--bg-end), var(--bg-start)); background-size: 400% 400%; animation: gradientMove 15s ease infinite; color: var(--text); margin: 0; padding: 15px; font-size: 14px; line-height: 1.5; min-height: 100vh; overflow-x: hidden; position: relative; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .star-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .star { position: absolute; border-radius: 50%; opacity: 0.8; animation: fall linear infinite; box-shadow: 0 0 5px rgba(255,255,255,0.5); }
        @keyframes fall { 0% { transform: translateY(-10vh); } 100% { transform: translateY(110vh); } }

        .controls, .summary-box, .nav-bar, .pallet-card { background: var(--card-glass) !important; backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.6) !important; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .pallet-card, .item-card { animation: fadeInUp 0.4s ease-out forwards; }
        .pallet-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; }
        button:active { transform: scale(0.96); transition: transform 0.1s; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content { animation: zoomIn 0.3s ease-out; }
        .page { transition: opacity 0.3s ease; }

        .toast { visibility: hidden; min-width: 250px; background-color: #22c55e; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 9999; top: 30px; left: 50%; transform: translateX(-50%); font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {top: 0; opacity: 0;} to {top: 30px; opacity: 1;} }
        @keyframes fadeout { from {top: 30px; opacity: 1;} to {top: 0; opacity: 0;} }

        .status-indicator { position: fixed; bottom: 20px; right: 20px; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 11px; z-index: 1000; box-shadow: var(--shadow); background: white; }
        .online { color: #166534; border: 1px solid #bbf7d0; }
        .offline { color: #991b1b; border: 1px solid #fecaca; }

        .wrap { max-width: 1200px; margin: auto; } 

        .header-box { background: linear-gradient(135deg, #2563eb, #1e40af); color: white; padding: 25px; border-radius: var(--radius); text-align: center; font-weight: 700; margin-bottom: 20px; font-size: 1.5rem; box-shadow: 0 10px 15px -3px rgba(37,99,235,0.2); }
        .nav-bar { display: flex; gap: 5px; margin-bottom: 20px; padding: 5px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .nav-btn { flex: 1; padding: 10px; background: transparent; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .nav-btn.active { background: var(--primary); color: white; }
        .page { display: none; } .page.active { display: block; }
        .controls { padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        
        .filter-group { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 20px; padding-bottom: 5px; }
        .filter-btn { white-space: nowrap; padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; background: white; font-weight: 500; color: var(--text-muted); transition: 0.2s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        input, select, button { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; background: #fff; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 25px; border-radius: var(--radius); width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .pallet-card { padding: 16px; border-radius: var(--radius); border-left: 6px solid var(--primary); box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .ibc-wide { grid-column: 1 / -1; border-left-color: #8b5cf6; } 
        .pallet-title { font-weight: 700; font-size: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
        .btn-action { background: #f8fafc; border: 1px solid #e2e8f0; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: 4px; color: var(--text-muted); }
        .btn-delete { background: #fef2f2; color: #ef4444; border-color: #fecaca; }
        .item-card { font-size: 13px; padding: 10px; border: 1px solid #f1f5f9; background: #ffffff; border-radius: 8px; margin-bottom: 8px; }
        .item-card.warning-stok { border: 1px solid #fca5a5; animation: warningPulse 2s infinite; }
        
        .summary-box { padding: 20px; border-radius: var(--radius); margin-top: 20px; border: 1px solid #e2e8f0; box-shadow: var(--shadow); }
        .summary-item { background: #eff6ff; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; border: 1px solid #bfdbfe; color: #1e40af; font-weight: 600; }
        
        .fifo-badge { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 5px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #fcd34d; animation: glowPulse 2s infinite; }
        .warning-badge { background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 5px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #fca5a5; }
        
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .login-box {
            background: white;
            padding: 35px 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: zoomIn 0.3s ease-out;
        }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <div style="font-size: 40px; margin-bottom: 10px;">📦</div>
        <h2 style="margin-top: 0; color: #1e3a8a; font-size: 1.25rem; margin-bottom: 6px;">GUDANG RAW MATERIAL</h2>
        <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">Silakan pilih nama dan masukkan password:</p>
        
        <select id="selectLoginOperator" onkeydown="handleLoginKey(event)" style="padding: 12px; font-size: 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; font-weight: 600; color: #1e40af; background: #eff6ff;">
            <option value="" disabled selected>-- Pilih Operator --</option>
            <option value="Tri">Tri</option>
            <option value="Gigin">Gigin</option>
            <option value="Dede">Dede</option>
        </select>

        <div style="position: relative; margin-bottom: 20px;">
            <input type="password" id="inputLoginPassword" placeholder="🔑 Masukkan Password" onkeydown="handleLoginKey(event)" style="padding: 12px 40px 12px 14px; font-size: 15px; margin-bottom: 0; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; text-align: center;">
            <span id="togglePasswordBtn" onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none;" title="Tampilkan/Sembunyikan Password">👁️</span>
        </div>

        <button onclick="prosesLogin()" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer;">Masuk Aplikasi</button>
    </div>
</div>

<div class="star-container" id="star-container"></div>
<div id="toast" class="toast"></div>
<div id="statusIndicator" class="status-indicator online">● Online</div>

<div id="rackModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0">Edit Rak</h3>
        <input type="hidden" id="editOriginalName">
        <label style="font-size: 12px; font-weight: 600;">Nama/ID Rak:</label>
        <input id="inputName" placeholder="Contoh: A1, B2">
        <label style="font-size: 12px; font-weight: 600;">Kategori:</label>
        <div style="display:flex;gap:8px;">
            <select id="inputCategory" style="flex:1"><option value="">-- Pilih Kategori --</option></select>
            <button type="button" style="width:auto;background:#10b981" onclick="tambahKategoriBaru()">+</button>
        </div>
        <label style="font-size: 12px; font-weight: 600;">Kapasitas:</label>
        <input id="inputLimit" type="number" placeholder="Max Stok">
        <label style="font-size: 12px; font-weight: 600;">Lokasi:</label>
        <input id="inputLoc" placeholder="Contoh: Gudang Samping">
        <div id="qtyWrapper">
            <label style="font-size: 12px; font-weight: 600;">Jumlah Rak Baru:</label>
            <input id="inputQty" type="number" value="1">
        </div>
        <label style="font-size: 12px; font-weight: 600;">Jenis:</label>
        <select id="inputType">
            <option value="Normal">Normal</option>
            <option value="IBC">IBC (Lebar)</option>
        </select>
        <div style="display:flex; gap:10px; margin-top: 15px;">
            <button onclick="saveRackData()" style="background:#22c55e; flex:1;">Simpan</button>
            <button onclick="closeModal('rackModal')" style="background:#94a3b8; flex:1;">Batal</button>
        </div>
    </div>
</div>

<div id="moveModal" class="modal">
    <div class="modal-content">
        <h3 id="moveTitle" style="margin-top:0">Pindah Lokasi</h3>
        <input type="hidden" id="moveSource">
        <input type="hidden" id="moveMode">
        <select id="moveDestSelect"></select>
        <div style="display:flex; gap:10px; margin-top: 15px;">
            <button onclick="confirmMove()" style="background:#22c55e; flex:1;">Pindahkan</button>
            <button onclick="closeModal('moveModal')" style="background:#94a3b8; flex:1;">Batal</button>
        </div>
    </div>
</div>

<div class="wrap">
    <div class="header-box">
        GUDANG RAW MATERIAL
        <div id="liveClock" style="font-size: 0.85rem; font-weight: normal; margin-top: 5px; opacity: 0.9;"></div>
    </div>
    
    <div class="nav-bar">
        <button id="btnStok" class="nav-btn active" onclick="showPage('stok')">Stok Gudang</button>
        <div class="nav-btn" style="padding:0; position:relative;">
            <select id="selectRiwayat" onchange="showPage(this.value)" style="width:100%; height:100%; border:none; background:transparent; text-align:center; font-weight:600; color:#64748b; cursor:pointer; font-family:inherit;">
                <option value="" disabled selected>📜 Menu / Riwayat</option>
                <option value="keluar">Barang Keluar</option>
                <option value="masuk">Riwayat Masuk</option>
                <option value="pindah">Riwayat Pindah</option>
                <option value="pencarian">🔍 Riwayat Pencarian</option>
                <option value="gagal">⚠️ Riwayat Gagal Hapus</option>
            </select>
        </div>
    </div>

    <div id="page-stok" class="page active">
        <div class="controls">
            <div style="display: flex; justify-content: space-between; align-items: center; background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px;">
                <span style="font-weight: 600; color: #1e40af; font-size: 13px;">👤 Operator Aktif: <b id="displayOpName">-</b></span>
                <button onclick="gantiOperator()" style="width: auto; padding: 5px 10px; font-size: 11px; background: #e11d48; margin-bottom: 0;">Ganti Operator</button>
            </div>

            <div class="filter-group" id="filterNav"></div>
            
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px;">
                <input id="cari" placeholder="🔍 Cari Item..." onkeyup="debounceRender()" style="margin-bottom:0; flex:1;">
                <div style="display:flex; gap: 15px; align-items: center;">
                    <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center; color:var(--text-muted);">
                        <input type="checkbox" id="hideEmpty" onchange="render()" style="width: auto; margin: 0 5px 0 0;"> Hide Kosong
                    </label>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:8px;">
                <input id="code" placeholder="Item" list="codeList">
                <datalist id="codeList"></datalist>
                <input id="qty" type="number" placeholder="Kg">
                <input id="jumlah" type="number" placeholder="Jmlh">
                <input id="tgl" type="date">
                <select id="pallet" style="grid-column: span 1;"></select>
            </div>
            <button onclick="tambah()" style="width: 100%; margin-top: 10px;">Simpan Masuk</button>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin-top:10px;">
                <button onclick="openRackModal('add')" style="background:#8b5cf6;">+ Rak Baru</button>
                <button onclick="exportStokCSV()" style="background:#f59e0b;">Exp CSV</button>
                <button onclick="document.getElementById('fileInput').click()" style="background:#10b981;">Imp CSV</button>
                <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="importCSV(event)">
            </div>
        </div>
        <div id="area" class="area-grid"></div>
        <div class="summary-box">
            <div style="font-weight:bold; border-bottom:1px solid #f1f5f9; padding-bottom:10px; margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between;" onclick="toggleSummary()">
                Total Stok (Hasil Filter) <span id="summaryIcon">▼</span>
            </div>
            <div id="ringkasan" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;"></div>
        </div>
    </div>

    <div id="page-keluar" class="page">
        <div class="controls">
            <input id="cariKeluar" placeholder="🔍 Cari Riwayat (Item/Op/Pallet)..." onkeyup="debounceRenderKeluar()">
            <button onclick="exportKeluarCSV()" style="background:#f59e0b; margin-top:5px;">📥 Export Excel (.csv)</button>
        </div>
        <div id="listKeluar" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;"></div>
    </div>

    <div id="page-masuk" class="page">
        <div class="controls">
            <input id="cariMasuk" placeholder="🔍 Cari Riwayat Masuk..." onkeyup="renderMasuk()">
            <button onclick="exportMasukCSV()" style="background:#f59e0b; margin-top:5px;">📥 Export Excel (.csv)</button>
        </div>
        <div id="listMasuk" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;"></div>
    </div>

    <div id="page-pindah" class="page">
        <div class="controls">
            <input id="cariPindah" placeholder="🔍 Cari Riwayat Pindah..." onkeyup="renderPindah()">
            <button onclick="exportPindahCSV()" style="background:#f59e0b; margin-top:5px;">📥 Export Excel (.csv)</button>
        </div>
        <div id="listPindah" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;"></div>
    </div>

    <div id="page-pencarian" class="page">
        <div class="controls">
            <input id="cariRiwayatPencarian" placeholder="🔍 Cari Kata Kunci / Operator..." onkeyup="renderPencarian()">
            <button onclick="exportPencarianCSV()" style="background:#f59e0b; margin-top:5px;">📥 Export Excel (.csv)</button>
        </div>
        <div id="listPencarian"></div>
    </div>

    <div id="page-gagal" class="page">
        <div class="controls">
            <input id="cariGagal" placeholder="🔍 Cari Riwayat Gagal Hapus..." onkeyup="renderGagal()">
            <button onclick="exportGagalCSV()" style="background:#f59e0b; margin-top:5px;">📥 Export Excel (.csv)</button>
        </div>
        <div id="listGagal" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;"></div>
    </div>
</div>

<script>
    const APP_VERSION = "1.0.6"; 

    function createStars() {
        const container = document.getElementById('star-container');
        const colors = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff'];
        for(let i=0; i<30; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            let size = Math.random() * 3 + 2;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            star.style.animationDuration = (Math.random() * 8 + 5) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(star);
        }
    }
    createStars();

    const firebaseConfig = { apiKey: "AIzaSyA9bEF4ylQ5zgl-7qnTD4zzeLUO1_pPnb0", databaseURL: "https://gudangrawmat-76d53-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "gudangrawmat-76d53" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    function showToast(message) {
        let toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "toast show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }
    
    let riwayatPindah = [], data = [], riwayatKeluar = [], riwayatMasuk = [], riwayatGagalHapus = [], riwayatPencarian = [], palletList = [], currentFilter = null; 
    let itemsPerPage = 5, currentPages = {}, pageKeluar = {}, pageMasuk = {}, pagePindah = {}, pageGagal = {}, pageCari = {};
    let timerCari, timerCariKeluar;
    let unlockedItems = []; 
    let lastSearchTerm = "";

    const operatorPasswords = {
        "Tri": "1234",
        "Gigin": "1234",
        "Dede": "1234"
    };

    function togglePasswordVisibility() {
        let passwordInput = document.getElementById('inputLoginPassword');
        let toggleBtn = document.getElementById('togglePasswordBtn');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.innerText = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleBtn.innerText = '👁️';
        }
    }

    function handleLoginKey(e) {
        if (e.key === 'Enter') {
            prosesLogin();
        }
    }

    let idleTimeLimit = 60 * 60 * 1000; 
    let idleTimer;

    function resetIdleTimer() {
        clearTimeout(idleTimer);
        let currentOp = localStorage.getItem('opName');
        if (currentOp) {
            idleTimer = setTimeout(() => {
                gantiOperator();
                alert("⚠️ Anda otomatis logout karena tidak ada aktivitas selama 1 jam.");
            }, idleTimeLimit);
        }
    }

    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('keydown', resetIdleTimer);
    window.addEventListener('click', resetIdleTimer);
    window.addEventListener('scroll', resetIdleTimer);
    window.addEventListener('touchstart', resetIdleTimer);

    window.addEventListener('DOMContentLoaded', () => {
        let savedOp = localStorage.getItem('opName');
        if (savedOp && operatorPasswords[savedOp]) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('displayOpName').innerText = savedOp;
            resetIdleTimer();
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
        }
    });

    function prosesLogin() {
        let selectedOp = document.getElementById('selectLoginOperator').value;
        let inputPass = document.getElementById('inputLoginPassword').value;

        if (!selectedOp) {
            alert("⚠️ Silakan pilih nama operator terlebih dahulu!");
            return;
        }
        if (!inputPass) {
            alert("⚠️ Masukkan password terlebih dahulu!");
            return;
        }

        if (operatorPasswords[selectedOp] && operatorPasswords[selectedOp] === inputPass) {
            localStorage.setItem('opName', selectedOp);
            document.getElementById('displayOpName').innerText = selectedOp;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('inputLoginPassword').value = ''; 
            document.getElementById('inputLoginPassword').type = 'password';
            document.getElementById('togglePasswordBtn').innerText = '👁️';
            showToast("👋 Selamat datang, " + selectedOp + "!");
            resetIdleTimer();
        } else {
            alert("❌ Password salah! Silakan coba lagi.");
            document.getElementById('inputLoginPassword').value = '';
            document.getElementById('inputLoginPassword').focus();
        }
    }

        localStorage.removeItem('opName');
        clearTimeout(idleTimer);
        document.getElementById('selectLoginOperator').value = "";
        document.getElementById('inputLoginPassword').value = "";
        document.getElementById('inputLoginPassword').type = 'password';
        document.getElementById('togglePasswordBtn').innerText = '👁️';

            unlockedItems.splice(arrIndex, 1);
            showToast("🔒 Item berhasil dikunci.");

        else { s.className = 'status-indicator offline'; s.innerText = '● Offline'; }

    window.addEventListener('offline', updateOnlineStatus);

    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('liveClock').innerText = now.toLocaleDateString('id-ID', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function debounceRender() { 
        clearTimeout(timerCari); 
        timerCari = setTimeout(() => { 
            render(); 
            catatPencarian(); 
        }, 300); 
    }
    function debounceRenderKeluar() { clearTimeout(timerCariKeluar); timerCariKeluar = setTimeout(() => { pageKeluar = {}; renderKeluar(); }, 300); }

    function catatPencarian() {
        let searchTerm = document.getElementById('cari').value.trim();
        let opName = localStorage.getItem('opName') || 'Tanpa Operator';
        
        if (searchTerm !== "" && searchTerm !== lastSearchTerm) {
            let isItemExists = data.some(item => (item.code || "").toLowerCase() === searchTerm.toLowerCase());

            if (isItemExists) {
                let now = new Date();
                let newSearch = {
                    kataKunci: searchTerm.toUpperCase(),
                    operator: opName,
                    tgl: now.toLocaleDateString('id-ID'),
                    jam: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                };
                
                riwayatPencarian.push(newSearch);
                db.ref('riwayat_pencarian').set(riwayatPencarian);
            }
            lastSearchTerm = searchTerm; 
        }
    }

    db.ref('riwayat_pencarian').on('value', s => { riwayatPencarian = Object.values(s.val() || {}); renderPencarian(); });

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function showMoveModal(mode, source) {
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        document.getElementById('moveSource').value = source;
        document.getElementById('moveMode').value = mode;
        let select = document.getElementById('moveDestSelect');
        select.innerHTML = '';
        palletList.filter(p => p.name !== source).forEach(p => {
            let count = data.filter(x => x.pallet == p.name).length;
            let limit = p.limit || 4;
            if (count < limit) { select.innerHTML += `<option value="${p.name}">${p.name} (${count}/${limit})</option>`; }
        });
        if(select.innerHTML === '') { alert("Semua rak tujuan sudah penuh!"); return; }
        document.getElementById('moveModal').style.display = 'flex';
    }

    function confirmMove() {
        let source = document.getElementById('moveSource').value;
        let mode = document.getElementById('moveMode').value;
        let dest = document.getElementById('moveDestSelect').value;
        let opName = localStorage.getItem('opName') || '';

        if (!opName) { gantiOperator(); return; }

        let namaDari = (mode === 'item') ? data.find(x => x.id === source)?.pallet || source : source;
        let itemMoved = (mode === 'item') ? data.find(x => x.id === source)?.code : "Semua item di " + source;

        riwayatPindah.push({
            item: itemMoved,
            dari: namaDari,
            ke: dest,
            operator: opName,
            tgl: new Date().toLocaleDateString('id-ID'),
            jam: new Date().toLocaleTimeString('id-ID')
        });
        db.ref('riwayat_pindah').set(riwayatPindah);

        if (mode === 'rack') {
            data.forEach(item => { if (item.pallet === source) item.pallet = dest; });
        } else {
            let targetItem = data.find(x => x.id === source);
            if (targetItem) targetItem.pallet = dest;
        }
        syncAndRender();
        showToast("🚚 Item berhasil dipindahkan!");
        closeModal('moveModal');
    }
    
    function renderPindah() {
        let list = document.getElementById('listPindah');
        list.innerHTML = '';
        let term = document.getElementById('cariPindah') ? document.getElementById('cariPindah').value.toLowerCase() : "";
        let filtered = riwayatPindah.filter(x => (x.item||"").toLowerCase().includes(term) || (x.operator||"").toLowerCase().includes(term));
        filtered.sort((a, b) => new Date(b.tgl + " " + b.jam) - new Date(a.tgl + " " + a.jam));

        let uniqueOps = [...new Set(filtered.map(x => (x.operator || 'Tanpa Operator').toUpperCase()))];
        
        uniqueOps.forEach(opNameUpper => {
            let opItems = filtered.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opNameUpper);
            if (pagePindah[opNameUpper] === undefined) pagePindah[opNameUpper] = 0;
            
            let totalPages = Math.ceil(opItems.length / itemsPerPage);
            let start = pagePindah[opNameUpper] * itemsPerPage;
            let displayItems = opItems.slice(start, start + itemsPerPage);
            
            let div = document.createElement('div');
            div.style.marginBottom = "20px";
            let html = `<div style="background:#fef3c7; padding:10px; border-radius:8px; margin-bottom:10px; font-weight:bold; color:#92400e;">👤 ${opNameUpper}</div>`;
            
            html += displayItems.map(x => {
                let actualIndex = riwayatPindah.indexOf(x);
                return `<div class="item-card"><b>${x.item}</b><br>
                         <small>Dari: ${x.dari} ➔ Ke: <b>${x.ke}</b></small><br>
                         <small>Tgl: ${x.tgl} | Jam: ${x.jam}</small><br>
                         <button class="btn-action btn-delete" style="margin-top:5px" onclick="hapusPindah(${actualIndex})">🗑️ Hapus</button></div>`;
            }).join('');
            
            if (totalPages > 1) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <button class="btn-action" onclick="changePagePindah('${opNameUpper}', -1)">Prev</button>
                            <span style="font-size:11px;">${pagePindah[opNameUpper]+1}/${totalPages}</span>
                            <button class="btn-action" onclick="changePagePindah('${opNameUpper}', 1)">Next</button>
                        </div>`;
            }
            div.innerHTML = html;
            list.appendChild(div);
        });
    }

    function changePagePindah(opName, dir) {
        let totalPages = Math.ceil(riwayatPindah.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pagePindah[opName] = Math.max(0, Math.min((pagePindah[opName] || 0) + dir, totalPages - 1));
        renderPindah();
    }

    function hapusPindah(i) {
        if (!confirm("Yakin ingin menghapus riwayat pindah ini?")) return;
        riwayatPindah.splice(i, 1);
        db.ref('riwayat_pindah').set(riwayatPindah).then(() => renderPindah());
    }
    
    function saveRackData() {
        let name = document.getElementById('inputName').value.toUpperCase();
        let category = document.getElementById('inputCategory').value.trim();
        let limit = parseInt(document.getElementById('inputLimit').value) || 4;
        let loc = document.getElementById('inputLoc').value;
        let type = document.getElementById('inputType').value;
        let qty = parseInt(document.getElementById('inputQty').value) || 1;
        let oldName = document.getElementById('editOriginalName').value;
        
        if(oldName) { 
            let p = palletList.find(x => x.name === oldName); 
            if(p) {
                data.forEach(item => { if(item.pallet === oldName) item.pallet = name; });
                p.name = name; p.category = category; p.limit = limit; p.lokasi = loc; p.type = type; 
                db.ref('gudang_final').set(data);
            }
        } else { 
            for(let i = 0; i < qty; i++) {
                let finalName = (qty > 1) ? `${name}-${i+1}` : name;
                palletList.push({name: finalName, category, limit, lokasi: loc, type}); 
            }
        }
        db.ref('pallets_config').set(palletList); closeModal('rackModal');
    }
    
    function showPage(p) {
        if (!p) return;
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
        document.getElementById('page-'+p).classList.add('active');
        if(p === 'stok') document.getElementById('btnStok').classList.add('active');
        document.getElementById('selectRiwayat').value = "";
        refreshAll();
    }
    
    function refreshAll() { renderFilters(); updatePalletSelect(); render(); renderKeluar(); renderMasuk(); renderPindah(); renderGagal(); renderPencarian(); }
    const sortByName = (a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'});
    
    function getCategory(p) { 
        if (p.category && p.category.trim() !== "") return p.category.toUpperCase();
        let n = p.name.toUpperCase().trim();
        if (n.startsWith("1") || n.startsWith("2") || n.startsWith("3")) return "Lantai 2";
        if (n.startsWith("IBC")) return "IBC";
        let letters = n.replace(/[^A-Z]/g, '');
        return letters.length > 0 ? letters : "Lainnya"; 
    }

    function renderFilters() {
        let nav = document.getElementById('filterNav');
        let uniqueCats = [...new Set(palletList.map(p => getCategory(p)))].sort();
        let finalCats = ['All', ...uniqueCats];
        nav.innerHTML = finalCats.map(f => `<button class="filter-btn ${currentFilter==f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('');
    }
    
    function setFilter(f) {
        currentFilter = (currentFilter === f) ? null : f;
        refreshAll();
    }
    
    function updatePalletSelect() {
        let select = document.getElementById('pallet');
        palletList.sort(sortByName); 
        let options = '<option value="">Pilih Rak/IBC...</option>';
        palletList.forEach(p => {
            let count = data.filter(x => x.pallet == p.name).length;
            let limit = p.limit || 4;
            let label = p.name + ' (' + count + '/' + limit + ')';
            if (count < limit) options += `<option value="${p.name}">${label}</option>`;
        });
        select.innerHTML = options;
    }
    
    function render() {
        let area = document.getElementById('area'); 
        let fragment = document.createDocumentFragment(); 
        area.innerHTML = '';
        let term = document.getElementById('cari').value.toLowerCase();
        let hideEmpty = document.getElementById('hideEmpty').checked;
        let totalStok = {};

        if (currentFilter === null && term === "") {
            document.getElementById('ringkasan').innerHTML = '';
            area.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">🔍 Silakan pilih Kategori atau Cari Item untuk mulai melihat data.</div>';
            return;
        }

        let globalOldest = {};
        data.forEach(item => {
            let itemDate = new Date(item.tgl);
            if (!globalOldest[item.code] || itemDate < new Date(globalOldest[item.code])) {
                globalOldest[item.code] = item.tgl;
            }
        });
        
        palletList.sort(sortByName); 
        palletList.forEach(p => {
            let prefix = getCategory(p);
            let items = data.filter(x => x.pallet == p.name);
            
            if (hideEmpty && items.length === 0) return;
            if (term !== "" && items.length === 0) return; 
            if (term === "" && currentFilter !== null && currentFilter !== 'All' && currentFilter !== prefix) return;
            
            let filtered = items.filter(x => x.code.toLowerCase().includes(term));
            
            filtered.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' }));
            
            if (items.length > 0 && filtered.length === 0) return;

            filtered.forEach(x => {
                if(!totalStok[x.code]) totalStok[x.code] = { count: 0, kg: 0 };
                totalStok[x.code].count += 1; totalStok[x.code].kg += Number(x.qty);
            });
            
            let displayItems = [];
            let totalPages = 0;
            if (items.length > 0) {
                if (currentPages[p.name] === undefined) currentPages[p.name] = 0;
                totalPages = Math.ceil(filtered.length / itemsPerPage);
                let start = currentPages[p.name] * itemsPerPage;
                displayItems = filtered.slice(start, start + itemsPerPage);
            }
            
            let card = document.createElement('div');
            card.className = (p.type === 'IBC') ? 'pallet-card ibc-wide' : 'pallet-card';
            
            let html = `<div class="pallet-title">${p.name} (${items.length}/${p.limit||4}) <div><button class="btn-action" onclick="showMoveModal('rack', '${p.name}')">🔗</button><button class="btn-action" onclick="openRackModal('edit', '${p.name}', ${p.limit||4}, '${p.lokasi||''}', '${p.type||'Normal'}', '${p.category||''}')">✏️</button><button class="btn-action btn-delete" onclick="deletePallet('${p.name}')">❌</button></div></div>`;
            
            if (items.length === 0) {
                html += `<div style="text-align:center; color:#94a3b8; padding:20px 0; font-size:12px; font-style:italic;">Rak Kosong</div>`;
            } else {
                displayItems.forEach((x) => { 
                    if(!x.id) x.id = 'legacy_' + Math.random().toString(36).substr(2, 9);
                    
                    let isGlobalOldest = (x.tgl === globalOldest[x.code]);
                    let isUnlocked = unlockedItems.includes(x.id); 
                    
                    let itemDate = new Date(x.tgl);
                    let today = new Date();
                    let diffDays = Math.floor((today - itemDate) / (1000 * 60 * 60 * 24));
                    let isStale = diffDays >= 7;

                    let badge = isGlobalOldest ? '<div class="fifo-badge"><span class="animate-flame">🔥</span> PRIORITAS</div>' : '';
                    if (isStale) {
                        badge += ` <div class="warning-badge" title="Item sudah > 7 hari di gudang, pastikan apakah sudah dipakai?">⚠️ >${diffDays} HARI (CEK)</div>`;
                    }

                    let cardClass = isStale ? 'item-card warning-stok' : 'item-card';

                    let actionButtons = '';
                    if (isGlobalOldest || isUnlocked) {
                        let lockButton = !isGlobalOldest ? `<button class="btn-action" style="flex:1; background:#64748b; color:white; padding:5px 2px; font-size:11px;" onclick="toggleLockItem('${x.id}')">🔒 Kunci</button>` : '';
                        actionButtons = `<div style="display:flex; flex-direction:row; margin-top:10px; gap:4px; width:100%;">
                                            <button class="btn-action" style="flex:1; padding:5px 2px; font-size:11px;" onclick="showMoveModal('item', '${x.id}')">🚚 Pindah</button>
                                            <button class="btn-action" style="flex:1; padding:5px 2px; font-size:11px;" onclick="editItem('${x.id}')">✏️ Edit</button>
                                            <button class="btn-action btn-delete" style="flex:1; padding:5px 2px; font-size:11px;" onclick="hapusStok('${x.id}')">🗑️ Hapus</button>
                                            ${lockButton}
                                        </div>`;
                    } else {
                        actionButtons = `<div style="display:flex; margin-top:10px; width:100%;">
                                            <button class="btn-action" style="flex:1; background:#e11d48; color:white; padding:6px; font-size:12px;" onclick="toggleLockItem('${x.id}')">🔓 Buka Kunci Item</button>
                                         </div>`;
                    }

                    html += `<div class="${cardClass}">
                                ${badge}
                                <div style="font-weight:bold; font-size:14px; margin-bottom:4px">${x.code}</div>
                                <div style="font-size:13px; color:#4b5563;">Qty: ${x.qty} Kg</div>
                                <div style="font-size:11px; color:#94a3b8; margin-top:4px;">Masuk: ${x.tgl} (${diffDays} hari lalu)</div>
                                ${actionButtons}
                            </div>`; 
                });
                
                if (totalPages > 1) {
                    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                                <button class="btn-action" onclick="changePage('${p.name}', -1)">Prev</button>
                                <span style="font-size:11px; font-weight:600;">${currentPages[p.name]+1}/${totalPages}</span>
                                <button class="btn-action" onclick="changePage('${p.name}', 1)">Next</button>
                            </div>`;
                }
            }
            
            card.innerHTML = html;
            fragment.appendChild(card);
        });
        area.appendChild(fragment);
        
        let r = ''; Object.keys(totalStok).sort((a,b)=>a.localeCompare(b, undefined, {numeric: true})).forEach(k => r += `<div class="summary-item"><b>${k}</b><br>${totalStok[k].count} Pcs | ${totalStok[k].kg} Kg</div>`);
        document.getElementById('ringkasan').innerHTML = r;
    }
    
    function changePage(palletName, dir) {
        let items = data.filter(x => x.pallet == palletName);
        let filtered = items.filter(x => x.code.toLowerCase().includes(document.getElementById('cari').value.toLowerCase()));
        let maxPage = Math.ceil(filtered.length / itemsPerPage);
        currentPages[palletName] = Math.max(0, Math.min(currentPages[palletName] + dir, maxPage - 1));
        render();
    }
    
    function deletePallet(n) { 
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        if (!confirm("Yakin ingin menghapus rak " + n + "?")) return;
        let itemsInPallet = data.filter(x => x.pallet === n);
        if (itemsInPallet.length > 0) {
            alert('⚠️ Rak "' + n + '" tidak bisa dihapus karena masih ada barang di dalamnya! Pindahkan barang terlebih dahulu.');
            return;
        }
        palletList = palletList.filter(p => p.name != n); 
        db.ref('pallets_config').set(palletList); 
    }
    
    function tambah() { 
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        let code = document.getElementById('code').value.toUpperCase(); 
        let qty = document.getElementById('qty').value; 
        let tgl = document.getElementById('tgl').value; 
        let pallet = document.getElementById('pallet').value; 
        let jumlah = parseInt(document.getElementById('jumlah').value) || 1; 

        if (!pallet) { alert("Harap pilih Rak/IBC terlebih dahulu!"); return; }

        let pConfig = palletList.find(p => p.name === pallet);
        let limit = pConfig ? (pConfig.limit || 4) : 4;
        let currentCount = data.filter(x => x.pallet === pallet).length;

        if (currentCount + jumlah > limit) {
            alert(`⚠️ Rak ${pallet} tidak mencukupi!\nKapasitas maksimal: ${limit}\nTerisi saat ini: ${currentCount}\nMau ditambah: ${jumlah}\n\n(Melebihi kapasitas maksimal rak)`);
            return;
        }
        
        for(let i = 0; i < jumlah; i++) {
            let uniqueId = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            data.push({id: uniqueId, code, qty, tgl, pallet}); 
            let now = new Date();
            riwayatMasuk.push({
                id: uniqueId,
                code, qty, tgl, pallet,
                operator: opName,
                jam: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            });
        }
        syncAndRender();
        showToast("✅ Berhasil menyimpan item!");
        document.getElementById('code').value=''; 
        document.getElementById('code').focus();
    }
    
    function hapusStok(id) { 
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        if (!confirm("Apakah Anda yakin ingin menghapus item ini?")) return;
        
        let index = data.findIndex(x => x.id === id);
        if (index === -1) {
            alert("⚠️ Item tidak ditemukan atau sudah terhapus oleh perangkat lain!");
            return;
        }
        
        let item = data[index]; 
        let now = new Date(); 
        
        let backupData = [...data];
        let backupRiwayatKeluar = [...riwayatKeluar];

        riwayatKeluar.push({
            code: item.code, 
            qty: item.qty, 
            tglMasuk: item.tgl, 
            pallet: item.pallet || '-', 
            operator: opName, 
            tglKeluar: now.toISOString().split('T')[0], 
            jam: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        }); 
        
        data.splice(index, 1); 

        Promise.all([
            db.ref('gudang_final').set(data),
            db.ref('riwayat_keluar').set(riwayatKeluar)
        ])
        .then(() => { 
            refreshAll();
            showToast("🗑️ Item berhasil dihapus.");
        })
        .catch((error) => {
            console.error("Gagal menghapus item ke server: ", error);
            data = backupData;
            riwayatKeluar = backupRiwayatKeluar;
            refreshAll();

            let failedEntry = {
                code: item.code,
                qty: item.qty,
                pallet: item.pallet || '-',
                operator: opName,
                tgl: new Date().toLocaleDateString('id-ID'),
                jam: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                alasan: error.message || "Gagal sinkronisasi jaringan/Firebase"
            };
            
            riwayatGagalHapus.push(failedEntry);
            db.ref('riwayat_gagal_hapus').set(riwayatGagalHapus);

            alert("❌ Gagal menghapus item ke server pusat! Item dikembalikan ke stok dan kejadian ini dicatat di menu 'Riwayat Gagal Hapus'.");
        });
    }
    
    function editItem(id) { 
        let opName = localStorage.getItem('opName') || '';
        if (!opName) { gantiOperator(); return; }

        let item = data.find(x => x.id === id);
        if (!item) { alert("Item tidak ditemukan!"); return; }

        let c = prompt("Edit Item:", item.code); 
        let q = prompt("Edit Kg:", item.qty); 
        let t = prompt("Edit Tanggal (YYYY-MM-DD):", item.tgl); 
        if(c && q && t) { 
            item.code = c.toUpperCase(); 
            item.qty = q; 
            item.tgl = t; 
            syncAndRender(); 
        } 
    }
    
    function syncAndRender() {
        Promise.all([
            db.ref('gudang_final').set(data),
            db.ref('riwayat_keluar').set(riwayatKeluar),
            db.ref('riwayat_masuk').set(riwayatMasuk)
        ])
        .then(() => { 
            refreshAll(); 
        })
        .catch((error) => {
            console.error("Gagal sinkronisasi ke database: ", error);
            alert("❌ Gagal menyimpan perubahan ke server! Periksa koneksi internet Anda dan coba lagi.");
        });
    }

    function hapusRiwayat(i) { 
        if (!confirm("Yakin ingin menghapus riwayat ini?")) return;
        riwayatKeluar.splice(i, 1); 
        db.ref('riwayat_keluar').set(riwayatKeluar).then(() => renderKeluar()); 
    }

    function hapusRiwayatGagal(i) {
        if (!confirm("Yakin ingin menghapus catatan riwayat gagal ini?")) return;
        riwayatGagalHapus.splice(i, 1);
        db.ref('riwayat_gagal_hapus').set(riwayatGagalHapus).then(() => renderGagal());
    }

    function hapusRiwayatPencarian(i) {
        let currentOp = localStorage.getItem('opName') || '';
        if (currentOp !== 'Tri') {
            alert("❌ Akses ditolak! Hanya user Tri yang diizinkan menghapus riwayat pencarian.");
            return;
        }
        if (!confirm("Yakin ingin menghapus catatan pencarian ini?")) return;
        riwayatPencarian.splice(i, 1);
        db.ref('riwayat_pencarian').set(riwayatPencarian).then(() => renderPencarian());
    }
    
    function exportStokCSV() { let csv = "Code,Qty,Tgl,Pallet\n"; data.forEach(x => csv += `${x.code},${x.qty},${x.tgl},${x.pallet}\n`); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'Data_Stok.csv'; a.click(); }
    
    function importCSV(e) { 
        let reader=new FileReader(); 
        reader.onload=function(e){ 
            e.target.result.split('\n').forEach((line,idx)=>{ 
                if(idx>0&&line){ 
                    let [code,qty,tgl,pallet]=line.split(','); 
                    if(code && qty && tgl && pallet) {
                        let uniqueId = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        data.push({id: uniqueId, code: code.trim(), qty: qty.trim(), tgl: tgl.trim(), pallet: pallet.trim()}); 
                    }
                }
            }); 
            db.ref('gudang_final').set(data); 
        }; 
        reader.readAsText(e.target.files[0]); 
    }

    function exportKeluarCSV() { let csv = "Tgl Masuk,Tgl Keluar,Jam,Item,Qty,Pallet,Operator\n"; riwayatKeluar.forEach(x => csv += `${x.tglMasuk},${x.tglKeluar},${x.jam},${x.code},${x.qty},${x.pallet || '-'},${x.operator}\n`); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'Barang_Keluar.csv'; a.click(); }
    function exportMasukCSV() { let csv = "Tgl,Jam,Item,Qty,Pallet,Operator\n"; riwayatMasuk.forEach(x => csv += `${x.tgl},${x.jam},${x.code},${x.qty},${x.pallet},${x.operator}\n`); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'Riwayat_Masuk.csv'; a.click(); }
    function exportPindahCSV() { let csv = "Tgl,Jam,Item,Dari,Ke,Operator\n"; riwayatPindah.forEach(x => csv += `${x.tgl},${x.jam},${x.item},${x.dari},${x.ke},${x.operator}\n`); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'Riwayat_Pindah.csv'; a.click(); }
    function exportGagalCSV() { let csv = "Tgl,Jam,Item,Qty,Pallet,Operator,Alasan\n"; riwayatGagalHapus.forEach(x => csv += `${x.tgl},${x.jam},${x.code},${x.qty},${x.pallet},${x.operator},${x.alasan}\n`); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'Riwayat_Gagal_Hapus.csv'; a.click(); }
    function exportPencarianCSV() { let csv = "Tgl,Jam,Kata Kunci,Operator\n"; riwayatPencarian.forEach(x => csv += `${x.tgl},${x.jam},${x.kataKunci},${x.operator}\n`); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'Riwayat_Pencarian.csv'; a.click(); }
    
    function hapusMasuk(i) { 
        if (!confirm("Yakin ingin menghapus riwayat masuk ini?")) return;
        riwayatMasuk.splice(i, 1); 
        db.ref('riwayat_masuk').set(riwayatMasuk).then(() => renderMasuk()); 
    }
    
    function renderKeluar() {
        let list = document.getElementById('listKeluar');
        list.innerHTML = '';
        let term = document.getElementById('cariKeluar') ? document.getElementById('cariKeluar').value.toLowerCase() : "";
        let filtered = riwayatKeluar.filter(x => (x.code || "").toLowerCase().includes(term) || (x.operator || "").toLowerCase().includes(term) || (x.pallet || "").toLowerCase().includes(term) || (x.tglKeluar || "").includes(term) || (x.tglMasuk || "").includes(term));
        filtered.sort((a, b) => new Date(b.tglKeluar) - new Date(a.tglKeluar));

        let uniqueOps = [...new Set(filtered.map(x => (x.operator || 'Tanpa Operator').toUpperCase()))];
        
        uniqueOps.forEach(opNameUpper => {
            let opItems = filtered.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opNameUpper);
            if (pageKeluar[opNameUpper] === undefined) pageKeluar[opNameUpper] = 0;
            let totalPages = Math.ceil(opItems.length / itemsPerPage);
            let start = pageKeluar[opNameUpper] * itemsPerPage;
            let displayItems = opItems.slice(start, start + itemsPerPage);
            
            let div = document.createElement('div');
            div.style.marginBottom = "20px";
            let html = `<div style="background:#e5e7eb; padding:10px; border-radius:8px; margin-bottom:10px; font-weight:bold; color:#374151;">👤 ${opNameUpper}</div>`;
            
            html += displayItems.map(x => {
                let actualIndex = riwayatKeluar.indexOf(x);
                let palletAsal = x.pallet ? x.pallet : '-';
                return `<div class="item-card"><b>${x.code}</b> | ${x.qty}Kg<br><small>Asal Pallet: <b>${palletAsal}</b></small><br><small>Masuk: ${x.tglMasuk} | Keluar: ${x.tglKeluar} (${x.jam})</small><br><button class="btn-action btn-delete" style="margin-top:5px" onclick="hapusRiwayat(${actualIndex})">🗑️ Hapus</button></div>`;
            }).join('');
            
            if (totalPages > 1) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <button class="btn-action" style="width:auto" onclick="changePageKeluar('${opNameUpper}', -1)">Prev</button>
                            <span style="font-size:11px;">${pageKeluar[opNameUpper]+1}/${totalPages}</span>
                            <button class="btn-action" style="width:auto" onclick="changePageKeluar('${opNameUpper}', 1)">Next</button>
                        </div>`;
            }
            div.innerHTML = html;
            list.appendChild(div);
        });
    }

    function renderMasuk() {
        let list = document.getElementById('listMasuk');
        list.innerHTML = '';
        let term = document.getElementById('cariMasuk') ? document.getElementById('cariMasuk').value.toLowerCase() : "";
        let filtered = riwayatMasuk.filter(x => (x.code || "").toLowerCase().includes(term) || (x.operator || "").toLowerCase().includes(term) || (x.tgl || "").includes(term));
        filtered.sort((a, b) => new Date(b.tgl) - new Date(a.tgl));

        let uniqueOps = [...new Set(filtered.map(x => (x.operator || 'Tanpa Operator').toUpperCase()))];
        uniqueOps.forEach(opNameUpper => {
            let opItems = filtered.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opNameUpper);
            if (pageMasuk[opNameUpper] === undefined) pageMasuk[opNameUpper] = 0;
            let totalPages = Math.ceil(opItems.length / itemsPerPage);
            let start = pageMasuk[opNameUpper] * itemsPerPage;
            let displayItems = opItems.slice(start, start + itemsPerPage);
            
            let div = document.createElement('div');
            div.style.marginBottom = "20px";
            let html = `<div style="background:#dcfce7; padding:10px; border-radius:8px; margin-bottom:10px; font-weight:bold; color:#166534;">👤 ${opNameUpper}</div>`;
            html += displayItems.map(x => {
                let actualIndex = riwayatMasuk.indexOf(x);
                return `<div class="item-card"><b>${x.code}</b> | ${x.qty}Kg | <b>Rak: ${x.pallet}</b><br><small>Tgl: ${x.tgl} | Jam: ${x.jam}</small><br><button class="btn-action btn-delete" style="margin-top:5px" onclick="hapusMasuk(${actualIndex})">🗑️ Hapus</button></div>`;
            }).join('');
            
            if (totalPages > 1) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <button class="btn-action" style="width:auto" onclick="changePageMasuk('${opNameUpper}', -1)">Prev</button>
                            <span style="font-size:11px;">${pageMasuk[opNameUpper]+1}/${totalPages}</span>
                            <button class="btn-action" style="width:auto" onclick="changePageMasuk('${opNameUpper}', 1)">Next</button>
                        </div>`;
            }
            div.innerHTML = html;
            list.appendChild(div);
        });
    }

    function renderGagal() {
        let list = document.getElementById('listGagal');
        if (!list) return;
        list.innerHTML = '';
        let term = document.getElementById('cariGagal') ? document.getElementById('cariGagal').value.toLowerCase() : "";
        let filtered = riwayatGagalHapus.filter(x => (x.code || "").toLowerCase().includes(term) || (x.operator || "").toLowerCase().includes(term) || (x.pallet || "").toLowerCase().includes(term));
        filtered.sort((a, b) => new Date(b.tgl + " " + b.jam) - new Date(a.tgl + " " + a.jam));

        let uniqueOps = [...new Set(filtered.map(x => (x.operator || 'Tanpa Operator').toUpperCase()))];
        uniqueOps.forEach(opNameUpper => {
            let opItems = filtered.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opNameUpper);
            if (pageGagal[opNameUpper] === undefined) pageGagal[opNameUpper] = 0;
            let totalPages = Math.ceil(opItems.length / itemsPerPage);
            let start = pageGagal[opNameUpper] * itemsPerPage;
            let displayItems = opItems.slice(start, start + itemsPerPage);
            
            let div = document.createElement('div');
            div.style.marginBottom = "20px";
            let html = `<div style="background:#fee2e2; padding:10px; border-radius:8px; margin-bottom:10px; font-weight:bold; color:#b91c1c;">👤 ${opNameUpper} (Gagal Hapus)</div>`;
            html += displayItems.map(x => {
                let actualIndex = riwayatGagalHapus.indexOf(x);
                return `<div class="item-card" style="border: 1px solid #fecaca; background: #fff5f5;">
                            <b>${x.code}</b> | ${x.qty}Kg | <b>Rak: ${x.pallet}</b><br>
                            <small style="color: #ef4444;">⚠️ Alasan: ${x.alasan}</small><br>
                            <small>Tgl: ${x.tgl} | Jam: ${x.jam}</small><br>
                            <button class="btn-action btn-delete" style="margin-top:5px" onclick="hapusRiwayatGagal(${actualIndex})">🗑️ Hapus Catatan</button>
                        </div>`;
            }).join('');
            
            if (totalPages > 1) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <button class="btn-action" style="width:auto" onclick="changePageGagal('${opNameUpper}', -1)">Prev</button>
                            <span style="font-size:11px;">${pageGagal[opNameUpper]+1}/${totalPages}</span>
                            <button class="btn-action" style="width:auto" onclick="changePageGagal('${opNameUpper}', 1)">Next</button>
                        </div>`;
            }
            div.innerHTML = html;
            list.appendChild(div);
        });
    }

    function renderPencarian() {
        let list = document.getElementById('listPencarian');
        if (!list) return;
        list.innerHTML = '';
        
        let term = document.getElementById('cariRiwayatPencarian') ? document.getElementById('cariRiwayatPencarian').value.toLowerCase() : "";
        let filtered = riwayatPencarian.filter(x => (x.kataKunci || "").toLowerCase().includes(term) || (x.operator || "").toLowerCase().includes(term));
        filtered.sort((a, b) => new Date(b.tgl + " " + b.jam) - new Date(a.tgl + " " + a.jam));

        list.style.display = "grid";
        list.style.gridTemplateColumns = "repeat(auto-fit, minmax(280px, 1fr))";
        list.style.gap = "15px";

        let currentOp = localStorage.getItem('opName') || '';
        let knownOps = Object.keys(operatorPasswords);
        let activeOps = [...new Set([...knownOps, ...filtered.map(x => x.operator || 'Tanpa Operator')])];

        activeOps.forEach(opName => {
            let opNameUpper = opName.toUpperCase();
            let opItems = filtered.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opNameUpper);
            
            if (pageCari[opNameUpper] === undefined) pageCari[opNameUpper] = 0;
            let totalPages = Math.ceil(opItems.length / itemsPerPage) || 1;
            let start = pageCari[opNameUpper] * itemsPerPage;
            let displayItems = opItems.slice(start, start + itemsPerPage);

            let colDiv = document.createElement('div');
            colDiv.style.background = "rgba(255, 255, 255, 0.7)";
            colDiv.style.border = "1px solid #cbd5e1";
            colDiv.style.borderRadius = "12px";
            colDiv.style.padding = "15px";
            colDiv.style.boxShadow = "var(--shadow)";
            colDiv.style.display = "flex";
            colDiv.style.flexDirection = "column";

            let html = `<div style="background:#f3e8ff; padding:10px; border-radius:8px; margin-bottom:12px; font-weight:bold; color:#6b21a8; text-align:center;">👤 ${opNameUpper}</div>`;
            
            if (opItems.length === 0) {
                html += `<div style="text-align:center; color:#94a3b8; font-size:12px; padding:20px 0; font-style:italic;">Belum ada riwayat pencarian</div>`;
            } else {
                html += displayItems.map(x => {
                    let actualIndex = riwayatPencarian.indexOf(x);
                    let keyword = (x.kataKunci || "").toLowerCase();
                    
                    // Hitung sisa stok aktif dengan kode ini di gudang
                    let activeItems = data.filter(item => (item.code || "").toLowerCase() === keyword);
                    // Ambil seluruh riwayat keluar dengan kode ini
                    let matchingKeluar = riwayatKeluar.filter(k => (k.code || "").toLowerCase() === keyword);

                    let statusDetails = "";

                    if (activeItems.length > 0) {
                        statusDetails += `<div style="background:#dcfce7; color:#166534; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold; display:inline-block; margin-top:4px; border:1px solid #bbf7d0;">🟢 Ada ${activeItems.length} Stok di Gudang</div>`;
                    }

                    if (matchingKeluar.length > 0) {
                        statusDetails += `<div style="background:#fee2e2; color:#b91c1c; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold; display:block; margin-top:4px; border:1px solid #fecaca; text-align:center;">🔴 Ada ${matchingKeluar.length} Item yang Sudah Dihapus/Keluar:</div>`;
                        matchingKeluar.forEach(k => {
                            statusDetails += `<div style="font-size:11px; color:#475569; background:#fff; padding:3px 6px; border-radius:4px; margin-top:2px; border:1px solid #e2e8f0;">
                                📅 Tgl Masuk: <b>${k.tglMasuk}</b><br>
                                📤 Tgl Dihapus: <b>${k.tglKeluar}</b>
                            </div>`;
                        });
                    }

                    if (activeItems.length === 0 && matchingKeluar.length === 0) {
                        statusDetails = `<div style="background:#f1f5f9; color:#64748b; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold; display:inline-block; margin-top:4px;">⚪ Tidak Ada Data</div>`;
                    }

                    let deleteBtnHTML = (currentOp === 'Tri') ? `<button class="btn-action btn-delete" style="margin-top:6px; width:100%;" onclick="hapusRiwayatPencarian(${actualIndex})">🗑️ Hapus Catatan</button>` : '';
                    
                    return `<div class="item-card" style="margin-bottom:8px;">
                                Mencari: <b>${x.kataKunci}</b>
                                ${statusDetails}
                                <small style="display:block; margin-top:4px; color:#94a3b8;">Cari Tgl: ${x.tgl} | Jam: ${x.jam}</small>
                                ${deleteBtnHTML}
                            </div>`;
                }).join('');
            }

            if (totalPages > 1) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:10px;">
                            <button class="btn-action" style="width:auto" onclick="changePageCari('${opNameUpper}', -1)">Prev</button>
                            <span style="font-size:11px; font-weight:600;">${pageCari[opNameUpper]+1}/${totalPages}</span>
                            <button class="btn-action" style="width:auto" onclick="changePageCari('${opNameUpper}', 1)">Next</button>
                        </div>`;
            }

            colDiv.innerHTML = html;
            list.appendChild(colDiv);
        });
    }
    
    function changePageKeluar(opName, dir) {
        let totalPages = Math.ceil(riwayatKeluar.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageKeluar[opName] = Math.max(0, Math.min((pageKeluar[opName] || 0) + dir, totalPages - 1));
        renderKeluar();
    }

    function changePageMasuk(opName, dir) {
        let totalPages = Math.ceil(riwayatMasuk.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageMasuk[opName] = Math.max(0, Math.min((pageMasuk[opName] || 0) + dir, totalPages - 1));
        renderMasuk();
    }

    function changePageGagal(opName, dir) {
        let totalPages = Math.ceil(riwayatGagalHapus.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageGagal[opName] = Math.max(0, Math.min((pageGagal[opName] || 0) + dir, totalPages - 1));
        renderGagal();
    }

    function changePageCari(opName, dir) {
        let totalPages = Math.ceil(riwayatPencarian.filter(x => (x.operator || 'Tanpa Operator').toUpperCase() === opName).length / itemsPerPage);
        pageCari[opName] = Math.max(0, Math.min((pageCari[opName] || 0) + dir, totalPages - 1));
        renderPencarian();
    }
</script>
